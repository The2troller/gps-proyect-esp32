; FLUXA - firmware ESP32-S3: TORRES (anclas) y PULSERAS
;
; Torres:    pio run -e anclaA -t upload      pio run -e anclaB -t upload
; Pulseras:  pio run -e pulsera1 -t upload    pio run -e pulsera2 -t upload   ...
; Monitor:   pio device monitor
; (o en VS Code, elegir el entorno en la barra de PlatformIO y apretar Upload)

[platformio]
default_envs = anclaA

[env]
platform = espressif32
framework = arduino
board = esp32-s3-devkitc-1
monitor_speed = 115200
; La app con WiFi + BLE es grande: particion "huge app" (3 MB) en flash de 4 MB.
; Si tu placa tiene 8 MB o mas, igual funciona.
board_upload.flash_size = 4MB
board_build.partitions = huge_app.csv
; Serial por el USB nativo del S3 (placas "mini" con un solo USB-C).
; Si tu placa tiene chip USB-serie (CH340/CP2102) y el monitor no muestra nada,
; borra estas dos lineas.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; ------------------------------------------------ TORRES (ancla.cpp)
[env:anclaA]
build_src_filter = +<ancla.cpp>
build_flags =
    ${env.build_flags}
    -DID_ANCLA_DEF=\"A\"

[env:anclaB]
build_src_filter = +<ancla.cpp>
build_flags =
    ${env.build_flags}
    -DID_ANCLA_DEF=\"B\"

; ------------------------------------------------ PULSERAS (pulsera.cpp)
; Para agregar otra pulsera, copia un bloque y cambia el numero (FX04, FX05...).
[env:pulsera1]
build_src_filter = +<pulsera.cpp>
build_flags =
    ${env.build_flags}
    -DID_PULSERA_DEF=\"FX01\"

[env:pulsera2]
build_src_filter = +<pulsera.cpp>
build_flags =
    ${env.build_flags}
    -DID_PULSERA_DEF=\"FX02\"

[env:pulsera3]
build_src_filter = +<pulsera.cpp>
build_flags =
    ${env.build_flags}
    -DID_PULSERA_DEF=\"FX03\"
