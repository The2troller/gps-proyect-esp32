; FLUXA - firmware de las anclas (ESP32-S3)
;
; Placa A:        pio run -e anclaA -t upload
; Placa B:        pio run -e anclaB -t upload
; Monitor serie:  pio device monitor
; (o con los botones de la barra de PlatformIO en VS Code, eligiendo el entorno abajo)

[platformio]
default_envs = anclaA

[env]
platform = espressif32
framework = arduino
board = esp32-s3-devkitc-1
monitor_speed = 115200
; La app con WiFi + BLE es grande: particion "huge app" (3 MB) en flash de 4 MB.
; Si tu placa tiene 8 MB o mas, igual funciona.
board_upload.flash_size = 4MB
board_build.partitions = huge_app.csv
; Serial por el USB nativo del S3 (placas "mini" con un solo USB-C).
; Si tu placa tiene chip USB-serie (CH340/CP2102) y el monitor no muestra nada,
; borra estas dos lineas.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:anclaA]
build_flags =
    ${env.build_flags}
    -DID_ANCLA_DEF=\"A\"

[env:anclaB]
build_flags =
    ${env.build_flags}
    -DID_ANCLA_DEF=\"B\"
